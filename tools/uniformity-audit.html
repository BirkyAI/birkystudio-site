<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Site uniformity audit</title>
<style>
  body { background:#111; color:#eee; font:13px/1.5 ui-monospace,Menlo,monospace; padding:20px; }
  iframe { width:1100px; height:600px; border:1px solid #333; position:absolute; left:-9999px; }
  pre { white-space:pre-wrap; }
  .ok { color:#4ade80; } .bad { color:#f87171; }
</style>
</head>
<body>
<h2>Uniformity audit: one background + one grid on every page</h2>
<pre id="out">running…</pre>
<div id="frames"></div>
<script>
const URLS = [
  "/", "/products", "/products/text-receptionist", "/products/voice-receptionist",
  "/blog", "/contact", "/portfolio", "/about", "/partners",
  "/products/ai-agent-setup",
  "/quick-log-template", "/ai-readiness-quiz", "/best-ai-receptionists-real-estate",
  "/birkystudio-vs-gohighlevel", "/birkystudio-vs-loman", "/tools/ai-savings-calculator",
  "/es/", "/es/products", "/es/contacto", "/es/portafolio", "/es/partners", "/es/blog"
];

const lines = [];
let done = 0;

async function check(url){
  const fr = document.createElement("iframe");
  fr.src = url;
  document.getElementById("frames").appendChild(fr);
  await new Promise(res => { fr.onload = res; setTimeout(res, 3000); });
  await new Promise(res => setTimeout(res, 300));

  const doc = fr.contentDocument;
  if (!doc){ lines.push(url + "  BLOCKED"); return; }

  // grid present on the page background?
  const pse = getComputedStyle(doc.body, "::before");
  const hasGrid = (pse.backgroundImage || "").includes("linear-gradient");

  // every section must be transparent
  const secs = [...doc.querySelectorAll("main > section, main section")];
  const opaque = [];
  for (const s of secs){
    const bg = getComputedStyle(s).backgroundColor;
    const m = bg.match(/rgba?\(([^)]+)\)/);
    if (!m) continue;
    const parts = m[1].split(",").map(Number);
    const a = parts.length > 3 ? parts[3] : 1;
    if (a > 0.05) opaque.push(bg + " on <section>");
  }

  // distinct opaque background colours anywhere full-width-ish
  const distinct = new Set();
  for (const el of doc.querySelectorAll("main div, main section, footer")){
    const bg = getComputedStyle(el).backgroundColor;
    const m = bg.match(/rgba?\(([^)]+)\)/);
    if (!m) continue;
    const parts = m[1].split(",").map(Number);
    const a = parts.length > 3 ? parts[3] : 1;
    if (a > 0.9) distinct.add(bg);
  }

  const bodyBg = getComputedStyle(doc.body).backgroundColor;
  const ok = opaque.length === 0 && hasGrid;
  lines.push(
    (ok ? "OK   " : "FAIL ") + url.padEnd(38) +
    " grid:" + (hasGrid ? "yes" : "NO ") +
    "  sections-with-own-bg:" + opaque.length +
    "  bodyBg:" + bodyBg +
    "  distinct-surface-colours:" + distinct.size
  );
  if (opaque.length) lines.push("       -> " + opaque.slice(0,4).join(" | "));
}

(async () => {
  for (const u of URLS){ await check(u); document.getElementById("out").textContent = lines.join("\n"); }
  const fails = lines.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("out").textContent =
    lines.join("\n") + "\n\n" + (fails === 0 ? "ALL PAGES UNIFORM" : fails + " page(s) still non-uniform");
  window.__auditDone = true;
})();
</script>
</body>
</html>
